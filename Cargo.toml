[workspace]
resolver = "2"
members = ["crates/posthaste-core", "crates/posthaste-app"]
# A patched dependency, not a workspace package: it is compiled as a
# dependency and its own tests are not part of `cargo test --workspace`.
exclude = ["third_party/xattr"]

# Distributable Windows build. Debug assertions stay off so gpui precompiles its
# shaders at build time (via `GPUI_FXC_PATH`) instead of loading them from the
# build machine's Cargo registry at runtime; symbols are stripped and the code
# is optimized.
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.22"
bytes = { version = "1", features = ["serde"] }
cookie_store = "0.22"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
mime_guess = "2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots", "gzip", "brotli", "deflate", "cookies", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
url = "2"
uuid = { version = "1", features = ["serde", "v5", "v7"] }

# gpui -> gpui_http_client -> zed-async-tar pulls xattr 0.2, which no longer
# compiles on Linux against current libc. See third_party/xattr/PATCH.md.
[patch.crates-io]
xattr = { path = "third_party/xattr" }
