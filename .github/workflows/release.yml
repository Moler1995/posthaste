name: Release

on:
  push:
    tags: ['v*']

# Repository write access is granted only to the publish job, never to the job
# that compiles the workspace.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release archive
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # rust-toolchain.toml names the bare 1.99.1 channel, which the runner
      # would resolve to its MSVC host. The release is built with the GNU
      # toolchain everywhere, including the plain `cargo` calls inside
      # scripts/build-dist.ps1.
      RUSTUP_TOOLCHAIN: 1.99.1-x86_64-pc-windows-gnu

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify MinGW toolchain
        shell: pwsh
        run: |
          $missing = @(
            @('x86_64-w64-mingw32-gcc', 'windres', 'ld') |
              Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) }
          )
          if ($missing.Count -gt 0) {
            throw "C:\msys64\mingw64\bin does not provide $($missing -join ', '). The runner image changed; reinstate the msys2/setup-msys2 step described in CONTRIBUTING.md."
          }

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/fxc-shim -> tools/fxc-shim/target

      # A tag must name exactly the version the archive will carry; a mismatch
      # stops the release before anything is built or published.
      - name: Verify tag matches the posthaste-app version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $tagVersion = $tag.Substring(1)
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'posthaste-app' } | Select-Object -First 1
          if (-not $package) {
            throw 'cargo metadata did not report a posthaste-app package.'
          }
          if ($package.version -ne $tagVersion) {
            throw "Tag '$tag' names version '$tagVersion', but posthaste-app is version '$($package.version)'. Bump the workspace version or retag."
          }
          Write-Host "Tag $tag matches posthaste-app $($package.version)."

      - name: Build portable archive
        shell: pwsh
        run: pwsh scripts/build-dist.ps1

      - name: Verify the built assets
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'posthaste-app' } |
            Select-Object -First 1 -ExpandProperty version
          $archive = "dist/posthaste-$version-windows-x86_64.zip"
          if (-not (Test-Path -LiteralPath $archive)) {
            throw "$archive was not produced."
          }
          if (-not (Test-Path -LiteralPath 'target/dist-staging/SHA256SUMS')) {
            throw 'target/dist-staging/SHA256SUMS was not produced.'
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/posthaste-*-windows-x86_64.zip
            target/dist-staging/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
          merge-multiple: true

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=()
          for file in release-assets/posthaste-*-windows-x86_64.zip release-assets/SHA256SUMS; do
            if [ ! -f "$file" ]; then
              echo "Expected release asset '$file' is missing." >&2
              exit 1
            fi
            assets+=("$file")
          done

          # A re-run replaces the assets of the existing release instead of
          # failing on the tag or creating a second release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
