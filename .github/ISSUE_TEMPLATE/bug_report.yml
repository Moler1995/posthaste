name: Bug report
description: Something is broken or behaves unexpectedly.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include the exact steps that reproduce the
        problem, and remove any credentials or private workspace data from
        pasted text before submitting.

  - type: input
    id: version
    attributes:
      label: Posthaste version
      description: The version from the release archive name (`posthaste-<version>-windows-x86_64.zip`), or `0.1.0` from `Cargo.toml` for a build from source.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. Open a workspace.
        2. ...
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Include any error message verbatim.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, logs, or anything else that helps. Remove secrets first.
    validations:
      required: false
