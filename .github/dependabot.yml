# Weekly dependency proposals. Routine minor and patch updates are grouped so
# they arrive as one pull request; gpui stays out of the group because its
# exact-pinned upgrade needs its own pull request and the checklist in
# docs/upgrading-gpui.md.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        patterns:
          - '*'
        exclude-patterns:
          - gpui
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
